<style>

@media (prefers-color-scheme: dark){:root[data-look="chase"]:not([data-theme="light"]){--bg:#07121E;--panel:#0D1D2E;--ink:#EAF1F8;--muted:#93A6B8;--line:#1C3147;--a1:#5DB2F5;--g1:#2E94E6;--done:#4CD08C;--wait:#F2B94B;--fail:#FF6B7F;--hi:#0F2A44;--con:#0A1826;--head:#0A2240;--hink:#FFFFFF;--hmuted:rgba(255,255,255,.75);--hline:rgba(255,255,255,.18);--node:#117ACA;--nodeink:#FFFFFF;--top:#117ACA;}}
:root[data-look="chase"][data-theme="dark"]{--bg:#07121E;--panel:#0D1D2E;--ink:#EAF1F8;--muted:#93A6B8;--line:#1C3147;--a1:#5DB2F5;--g1:#2E94E6;--done:#4CD08C;--wait:#F2B94B;--fail:#FF6B7F;--hi:#0F2A44;--con:#0A1826;--head:#0A2240;--hink:#FFFFFF;--hmuted:rgba(255,255,255,.75);--hline:rgba(255,255,255,.18);--node:#117ACA;--nodeink:#FFFFFF;--top:#117ACA;}
:root[data-look="graphite"]{--sans:"Geist",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--display:var(--sans);--mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;--radius:6px;--bg:#F4F4F5;--panel:#FFFFFF;--ink:#18181B;--muted:#63636E;--line:#E0E0E4;--a1:#3F3F46;--g1:#27272A;--done:#15803D;--wait:#A16207;--fail:#DC2626;--hi:#EDEDF0;--con:#EDEDF0;--head:#F4F4F5;--hink:#18181B;--hmuted:#63636E;--hline:#E0E0E4;--node:#27272A;--nodeink:#FFFFFF;--top:#27272A;}

:root[data-look="graphite"][data-theme="dark"]{--bg:#0C0C0E;--panel:#151517;--ink:#EDEDEF;--muted:#9A9AA5;--line:#27272B;--a1:#D4D4D8;--g1:#E4E4E7;--done:#4ADE80;--wait:#FBBF24;--fail:#F87171;--hi:#1D1D21;--con:#111113;--head:#0C0C0E;--hink:#EDEDEF;--hmuted:#9A9AA5;--hline:#27272B;--node:#E4E4E7;--nodeink:#0C0C0E;--top:#3F3F46;}
:root[data-look="aurora"]{--sans:"Geist",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--display:"Bricolage Grotesque","Geist",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;--radius:12px;--bg:#F6F6FA;--panel:#FFFFFF;--ink:#14151C;--muted:#646B7D;--line:#E3E5EE;--a1:#5B3DF5;--g1:#6B4DFF;--done:#0E9F6E;--wait:#A8690A;--fail:#D83A52;--hi:#F3F0FF;--con:#EFEFF5;--head:#FFFFFF;--hink:#14151C;--hmuted:#646B7D;--hline:#E3E5EE;--node:#6B4DFF;--nodeink:#FFFFFF;--top:linear-gradient(90deg,#6B4DFF,#F0507A);}
@media (prefers-color-scheme: dark){:root[data-look="aurora"]:not([data-theme="light"]){--bg:#0D0E13;--panel:#15171E;--ink:#EEF0F6;--muted:#9AA1B2;--line:#252934;--a1:#A99BFF;--g1:#8B7CFF;--done:#3DD9A0;--wait:#FFC457;--fail:#FF6B7A;--hi:#1C1A30;--con:#111319;--head:#15171E;--hink:#EEF0F6;--hmuted:#9AA1B2;--hline:#252934;--node:#8B7CFF;--nodeink:#FFFFFF;--top:linear-gradient(90deg,#8B7CFF,#FF7AA2);}}
:root[data-look="aurora"][data-theme="dark"]{--bg:#0D0E13;--panel:#15171E;--ink:#EEF0F6;--muted:#9AA1B2;--line:#252934;--a1:#A99BFF;--g1:#8B7CFF;--done:#3DD9A0;--wait:#FFC457;--fail:#FF6B7A;--hi:#1C1A30;--con:#111319;--head:#15171E;--hink:#EEF0F6;--hmuted:#9AA1B2;--hline:#252934;--node:#8B7CFF;--nodeink:#FFFFFF;--top:linear-gradient(90deg,#8B7CFF,#FF7AA2);}
:root[data-look="evergreen"]{--sans:"DM Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--display:var(--sans);--mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;--radius:10px;--bg:#F4F7F4;--panel:#FFFFFF;--ink:#10201A;--muted:#5B6B63;--line:#DDE5DF;--a1:#0B6B4F;--g1:#0F8A65;--done:#0F8A65;--wait:#9A6400;--fail:#C4314B;--hi:#E8F5EF;--con:#EDF2EE;--head:#0E3B2E;--hink:#FFFFFF;--hmuted:rgba(255,255,255,.76);--hline:rgba(255,255,255,.18);--node:#2FB383;--nodeink:#06281B;--top:#2FB383;}
@media (prefers-color-scheme: dark){:root[data-look="evergreen"]:not([data-theme="light"]){--bg:#08130F;--panel:#0E1E18;--ink:#E9F2EE;--muted:#92A69D;--line:#1B3329;--a1:#5FD3A6;--g1:#2FB383;--done:#5FD3A6;--wait:#F2B94B;--fail:#FF6B7F;--hi:#12291F;--con:#0A1712;--head:#0C2A20;--hink:#FFFFFF;--hmuted:rgba(255,255,255,.76);--hline:rgba(255,255,255,.18);--node:#2FB383;--nodeink:#06281B;--top:#2FB383;}}
:root[data-look="evergreen"][data-theme="dark"]{--bg:#08130F;--panel:#0E1E18;--ink:#E9F2EE;--muted:#92A69D;--line:#1B3329;--a1:#5FD3A6;--g1:#2FB383;--done:#5FD3A6;--wait:#F2B94B;--fail:#FF6B7F;--hi:#12291F;--con:#0A1712;--head:#0C2A20;--hink:#FFFFFF;--hmuted:rgba(255,255,255,.76);--hline:rgba(255,255,255,.18);--node:#2FB383;--nodeink:#06281B;--top:#2FB383;}
:root[data-look="paper"]{--sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--display:"Fraunces",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--radius:4px;--bg:#FAF7F2;--panel:#FFFFFF;--ink:#201A14;--muted:#6F655A;--line:#E8E0D5;--a1:#A8481F;--g1:#C2410C;--done:#2F7D4F;--wait:#946200;--fail:#B83232;--hi:#F6EEE4;--con:#F3EDE4;--head:#FAF7F2;--hink:#201A14;--hmuted:#6F655A;--hline:#E8E0D5;--node:#C2410C;--nodeink:#FFFFFF;--top:#201A14;}
@media (prefers-color-scheme: dark){:root[data-look="paper"]:not([data-theme="light"]){--bg:#16130F;--panel:#1F1B16;--ink:#F1EBE3;--muted:#A79C8F;--line:#332C24;--a1:#F0A070;--g1:#E07B45;--done:#6FCF97;--wait:#E9B84E;--fail:#F08080;--hi:#2A231B;--con:#1A1612;--head:#16130F;--hink:#F1EBE3;--hmuted:#A79C8F;--hline:#332C24;--node:#E07B45;--nodeink:#16130F;--top:#E07B45;}}
:root[data-look="paper"][data-theme="dark"]{--bg:#16130F;--panel:#1F1B16;--ink:#F1EBE3;--muted:#A79C8F;--line:#332C24;--a1:#F0A070;--g1:#E07B45;--done:#6FCF97;--wait:#E9B84E;--fail:#F08080;--hi:#2A231B;--con:#1A1612;--head:#16130F;--hink:#F1EBE3;--hmuted:#A79C8F;--hline:#332C24;--node:#E07B45;--nodeink:#16130F;--top:#E07B45;}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:15px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--a1)}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--g1);outline-offset:-2px}
.mono{font-family:var(--mono)}

.opts{padding:6px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12.5px}
.orow{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:3px 0}
.orow span{flex:none;width:48px;color:var(--muted)}
.orow button{flex:none;font-size:12.5px;font-weight:500;padding:3px 11px;border-radius:999px;border:1px solid var(--line);background:transparent}
.orow button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero{background:var(--head);color:var(--hink);border-bottom:1px solid var(--line)}
.hero::before{content:"";display:block;height:4px;background:var(--top)}
.hero .in,.wrap,.replay .in{max-width:640px;margin:0 auto}
.hero .in{padding:14px 16px 16px}
.top{display:flex;align-items:center;gap:10px}
.key{font-family:var(--mono);font-size:.76rem;padding:2px 8px;border-radius:4px;border:1px solid var(--hline);color:var(--hmuted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:2px 10px 2px 8px;border-radius:999px;color:var(--hink);background:color-mix(in srgb,var(--hink) 13%,transparent)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--node)}
.badge.wait{color:#2B1B00;background:#F2B94B}
.badge.wait i{background:#2B1B00}
.badge.fin{color:#06281B;background:#4CD08C}
.badge.fin i{background:#06281B}
.elapsed{margin-left:auto;font-size:.8rem;color:var(--hmuted);font-variant-numeric:tabular-nums}
.hero h1{font-family:var(--display);font-size:1.3rem;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:12px 0 0}
.sent{font-size:1rem;line-height:1.45;color:var(--hmuted);margin:8px 0 0}
.sent b{color:var(--hink);font-weight:600}
.ctitle{font-family:var(--display);font-size:1rem;font-weight:600;margin:8px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-compact .in{padding:10px 16px 12px}
.h-compact .bars{margin:14px 0 0}
.lane{padding:10px 0 0;margin-top:10px;border-top:1px solid var(--hline)}
.lh{display:flex;justify-content:space-between;gap:10px;font-size:.76rem;color:var(--hmuted);margin-bottom:8px}
.lh .mono{color:var(--hink)}
.lnodes{display:flex;list-style:none;margin:0;padding:0}
.lnodes li{flex:1;min-width:0;position:relative;text-align:center;font-size:.72rem;line-height:1.2;color:var(--hmuted);padding:0 2px;overflow-wrap:anywhere}
.lnodes li::before{content:"";position:absolute;top:9px;left:calc(-50% + 13px);width:calc(100% - 26px);height:2px;background:var(--hline)}
.lnodes li:first-child::before{display:none}
.lnodes li.done::before,.lnodes li.cur::before{background:var(--node)}
.ln{display:block;width:20px;height:20px;border-radius:50%;margin:0 auto 4px;border:2px solid color-mix(in srgb,var(--hink) 40%,transparent);font-size:.68rem;font-weight:700;line-height:16px;color:var(--nodeink)}
.lnodes .done{color:var(--hink)}
.lnodes .done .ln{background:var(--node);border-color:var(--node)}
.lnodes li.cur{color:var(--hink);font-weight:600;margin:0}
.lnodes .cur .ln{background:var(--hink);border-color:var(--hink);box-shadow:0 0 0 3px color-mix(in srgb,var(--node) 55%,transparent)}
@media (prefers-reduced-motion:no-preference){
  .badge:not(.fin) i{animation:blink 1.8s ease-in-out infinite}
  @keyframes blink{50%{opacity:.3}}
  .ic.in_progress::before{animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
}
@media (prefers-reduced-motion:reduce){.pbt i{transition:none}}

.wrap{padding:10px 16px 20px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{font-size:.92rem;font-weight:500;padding:9px 14px 8px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--g1)}
.view{margin-top:14px}
.empty{color:var(--muted);font-size:.9rem;padding:14px 0}

.ic{flex:none;width:16px;height:16px;position:relative;display:inline-block;vertical-align:-3px}
.ic::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1.5px solid var(--muted);opacity:.55}
.ic.done::before{content:"✓";inset:0;border:0;opacity:1;color:var(--done);font-size:.85rem;font-weight:700;line-height:16px;text-align:center}
.ic.failed::before{content:"✕";inset:0;border:0;opacity:1;color:var(--fail);font-size:.8rem;font-weight:700;line-height:16px;text-align:center}
.ic.wait::before{inset:2px;border-radius:2px;border:0;opacity:1;background:linear-gradient(90deg,var(--wait) 35%,transparent 35%,transparent 65%,var(--wait) 65%)}
.ic.in_progress::before{inset:2px;border:2px solid var(--g1);border-top-color:transparent;opacity:1}

.list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.list + .list{margin-top:10px}
.ghead{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:0;background:none;text-align:left;font-size:.84rem;font-weight:600}
div.ghead{cursor:default}
.ghead .lbl{font-family:var(--mono);font-weight:500;font-size:.8rem}
.chev{flex:none;width:10px;color:var(--muted);font-size:.68rem}
.lbl{flex:1;min-width:0}
.rt{flex:none;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.step{border-top:1px solid var(--line)}
.step.here{background:var(--hi);box-shadow:inset 3px 0 0 var(--g1)}
.step.here.wait{box-shadow:inset 3px 0 0 var(--wait)}
.srowwrap{display:flex;align-items:flex-start;gap:8px;padding-right:12px}
.srowwrap .hash{margin-top:10px}
.srow{flex:1;min-width:0;display:flex;align-items:flex-start;gap:9px;padding:9px 0 9px 12px;border:0;background:none;text-align:left;font-size:.92rem}
.srow .ic{margin-top:3px}
.srow .rt{margin-top:2px}
.step.todo .lbl > span:first-child{color:var(--muted)}
.step.here .lbl > span:first-child{font-weight:600}
.nowline{display:block;font-size:.84rem;color:var(--a1);margin-top:1px}
.step.wait .nowline{color:var(--wait)}
.hash{flex:none;font-family:var(--mono);font-size:.76rem;text-decoration:none;border-bottom:1px dotted currentColor}
.sdet{padding:2px 12px 12px 37px}
.dsec{margin:10px 0 0}
.dsec:first-child{margin-top:0}
.dsec h3{font-size:.74rem;font-weight:600;color:var(--muted);margin:0 0 3px}
.dsec p{margin:0;font-size:.88rem}
.cmd{font-family:var(--mono);font-size:.74rem;background:var(--con);border-radius:6px;padding:5px 8px;overflow-x:auto;white-space:nowrap}
.res{font-size:.82rem;margin:3px 0 0}
.res.ok{color:var(--done)}.res.bad{color:var(--fail)}
.add{color:var(--done)}.del{color:var(--fail)}
.sa{font-size:.86rem;margin:0 0 6px}
.sa p{margin:1px 0 0;color:var(--muted)}
.sa p b{color:var(--ink);font-weight:500}
.nt{font-size:.86rem;margin:0 0 5px}
.nt span{color:var(--muted)}
.chip{display:inline-block;font-size:.7rem;font-weight:600;padding:0 8px;border-radius:999px;border:1px solid var(--line);margin-left:6px;vertical-align:1px;white-space:nowrap;color:var(--muted)}
.chip.a{border-color:color-mix(in srgb,var(--a1) 45%,transparent);color:var(--a1)}
.chip.d{border-color:color-mix(in srgb,var(--done) 45%,transparent);color:var(--done)}
.chip.f{border-color:color-mix(in srgb,var(--fail) 45%,transparent);color:var(--fail)}
.chip.w{border-color:color-mix(in srgb,var(--wait) 50%,transparent);color:var(--wait)}
.tag{display:inline-block;font-family:var(--mono);font-size:.68rem;font-weight:500;padding:0 6px;border-radius:4px;margin-right:4px;color:var(--a1);background:var(--hi);border:1px solid color-mix(in srgb,var(--a1) 25%,transparent)}

.out{margin-top:18px}
.ohead{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;font-weight:600;color:var(--muted);margin:0 0 6px}
.linkbtn{border:0;background:none;padding:0;color:var(--a1);font-size:.8rem;font-weight:500}
.console{font-family:var(--mono);font-size:.72rem;line-height:1.6;background:var(--con);border:1px solid var(--line);border-radius:10px;padding:6px 0;max-height:320px;overflow:auto}
.cl{padding:0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.cl .tm{color:var(--muted)}
.cl.ok{color:var(--done)}.cl.bad{color:var(--fail)}.cl.warn{color:var(--wait)}.cl.dim{color:var(--muted)}

.summary{font-size:1.04rem;line-height:1.5;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0;padding:0;list-style:none;font-size:.82rem;color:var(--muted)}
.facts b{color:var(--ink);font-weight:500}
.lead{color:var(--muted);font-size:.86rem;margin:8px 0 0}
details{border-top:1px solid var(--line)}
details:first-of-type{margin-top:16px}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 0;font-size:.95rem;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--muted);font-size:.7rem;width:10px}
details[open] > summary::before{content:"▾"}
summary .rt{margin-left:auto}
.dbody{padding:0 0 16px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
table.wide{min-width:0}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-weight:500;color:var(--muted);font-size:.78rem}
td.st{white-space:nowrap}
td code{font-family:var(--mono);font-size:.78rem}
.prow{display:flex;gap:9px;padding:9px 12px;font-size:.9rem}
.prow .ic{margin-top:2px}
.prow b{font-weight:500;display:block}
.prow .dw{display:block;color:var(--muted);font-size:.84rem;margin:1px 0 4px}
.dec{margin:0;padding-left:1.3em;font-size:.92rem}
.dec li{margin:0 0 5px}
.foot{margin-top:26px}
.path{font-family:var(--mono);font-size:.76rem;background:var(--con);border-radius:8px;padding:7px 10px;overflow-x:auto;white-space:nowrap;margin:10px 0}
.log{font-family:var(--mono);font-size:.7rem;line-height:1.6;background:var(--con);border-radius:8px;overflow:auto;max-height:300px;padding:6px 0;margin-bottom:12px}
.log div{white-space:pre;padding:0 10px}
.log div.last{background:var(--hi)}
.log .ty{color:var(--a1)}
.replay{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:7px 16px calc(7px + env(safe-area-inset-bottom,0px))}
.replay .in{display:flex;align-items:center;gap:8px}
.replay button{flex:none;font-size:.82rem;font-weight:500;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.replay button.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600;min-width:60px}
.replay input[type=range]{flex:1;min-width:60px;accent-color:var(--g1)}

.bars{margin:4px 0 0}
.hero a{color:var(--hink);text-decoration:none;border-bottom:1px dotted currentColor}

.bars{margin:12px 0 0}
.lane.one .lh{margin-bottom:0}

.lcap b{display:block;font-weight:600}
.lcap span{display:block;color:var(--hmuted);margin-top:1px}
.meta1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:.84rem;margin:8px 0 0}

.lhb{width:100%;border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}

.hl1{font-family:var(--display);font-size:1.25rem;font-weight:600;line-height:1.25;letter-spacing:-.01em;margin:0}
.hbul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.hbul li{font-size:.92rem;padding-left:12px;border-left:3px solid var(--g1)}
.hbul b{display:block;font-size:.76rem;font-weight:600;color:var(--muted)}
.qa{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);font-size:.9rem}

.qa p.ok{color:var(--done)}
.qa p.wt{color:var(--wait)}
summary .ic{margin-right:2px}
.v-boxed .lane{border-top:0;margin-top:4px;padding-top:4px}
.v-boxed .lane.act{background:color-mix(in srgb,var(--hink) 7%,transparent);border-radius:var(--radius);padding:12px 12px 10px;margin:8px -12px}

.v-numbered .ln{font-size:.64rem;color:var(--hmuted)}
.v-numbered .done .ln{color:var(--nodeink)}
.v-numbered .cur .ln{color:var(--head)}
.psteps{display:flex;gap:4px;list-style:none;margin:0;padding:0}

.psteps li.done{background:var(--node);border-color:var(--node);color:var(--nodeink)}
.psteps li.cur{background:transparent;border:2px solid var(--hink);padding:4px 3px;color:var(--hink);font-weight:700}
.lane.one .psteps{margin-top:10px}
.v-prail .lane{border-top:0;position:relative;padding:8px 0 6px 28px;margin-top:0}
.v-prail .lane::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--hline)}
.v-prail .lane:first-child::before{top:14px}
.v-prail .lane:last-child::before{bottom:calc(100% - 14px)}
.v-prail .lane.done::before{background:var(--node)}
.v-prail .lane::after{content:"";position:absolute;left:0;top:8px;width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--hink) 40%,transparent);background:var(--head);font-size:.56rem;font-weight:700;line-height:12px;text-align:center;color:var(--nodeink)}
.v-prail .lane.done::after{content:"✓";background:var(--node);border-color:var(--node)}
.v-prail .lane.in_progress::after{background:var(--hink);border-color:var(--hink);box-shadow:0 0 0 3px color-mix(in srgb,var(--node) 55%,transparent)}
.v-prail .lane.one .ic{display:none}
.appbar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}

.mark{display:inline-flex;align-items:center;gap:3px;flex:none}

.mark i:nth-child(3){opacity:.3}
.mark.big i{width:14px;height:14px}
.abtn{flex:none;font:inherit;font-size:.8rem;font-weight:500;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;list-style:none}
.abtn::-webkit-details-marker{display:none}
details.appr,details.appr:first-of-type,details.appr:last-of-type{position:relative;flex:none;border:0;margin:0}

.appr > summary{display:block;padding:4px 10px;font-size:.8rem;font-weight:500}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:260px;padding:10px 12px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}

.pr{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.pr button{font:inherit;font-size:.78rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}

@media (max-width:560px){.brand .btag{display:none}}
.intro,.guide{background:var(--hi);border-bottom:1px solid var(--line);font-size:.9rem}
.intro .in,.guide .in{max-width:1100px;margin:0 auto;padding:12px 16px 14px}
.intro p{margin:0 0 10px}
.isteps{list-style:none;margin:0 0 10px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

.legend2{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:.88rem}
.welcome .in{max-width:560px;margin:0 auto;padding:44px 20px 60px}
.welcome h1{font-family:var(--display);font-size:2rem;font-weight:700;letter-spacing:-.02em;margin:14px 0 4px}
.welcome .wl{font-size:1.05rem;color:var(--muted);margin:0 0 16px}
.welcome .cmd{font-size:.9rem;padding:8px 12px}
.wbtn{margin-top:22px;font:inherit;font-weight:600;padding:9px 18px;border-radius:10px;border:0;background:var(--g1);color:#fff;cursor:pointer}
.sidecard{display:none}
.sdh{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.sdh p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.sdb{padding:12px 14px 14px}
.step.picked{background:var(--hi);box-shadow:inset 3px 0 0 var(--g1)}
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:400px minmax(0,1fr);align-items:start;max-width:1560px;margin:0 auto}
  .hero{position:sticky;top:0;max-height:100vh;overflow:auto;border-bottom:0;border-right:1px solid var(--line);min-height:calc(100vh - 90px)}
  .hero .in,.wrap,.replay .in{max-width:none}
  .hero .in{padding:20px 22px 24px}
  .wrap{padding:14px 26px 28px;margin:0;width:100%;min-width:0}
  .rungrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,44%);gap:20px;align-items:start}

.sizes{display:flex;gap:8px}

.lnodes .ln{position:relative}
@media (prefers-reduced-motion:no-preference){
  @keyframes aPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--node) 75%,transparent)}75%,100%{box-shadow:0 0 0 10px transparent}}
  @keyframes aBreathe{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--node) 55%,transparent),0 0 0 0 transparent}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--node) 55%,transparent),0 0 16px 5px color-mix(in srgb,var(--node) 80%,transparent)}}
  @keyframes aSpin{to{transform:rotate(360deg)}}
  @keyframes aSlideX{from{background-position:-60% 0}to{background-position:160% 0}}
  @keyframes aSlideY{from{background-position:0 -60%}to{background-position:0 160%}}
  @keyframes aRipple{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.4);opacity:0}}
  [data-anim="pulse"] .lnodes .cur .ln,[data-anim="pulse"] .v-prail .lane.in_progress::after{animation:aPulse 1.7s ease-out infinite}
  [data-anim="breathe"] .lnodes .cur .ln,[data-anim="breathe"] .v-prail .lane.in_progress::after{animation:aBreathe 2.8s ease-in-out infinite}
  [data-anim="spin"] .lnodes .cur .ln{box-shadow:none}
  [data-anim="spin"] .lnodes .cur .ln::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid color-mix(in srgb,var(--hink) 18%,transparent);border-top-color:var(--hink);animation:aSpin 1s linear infinite}
  [data-anim="flow"] .lnodes li.cur + li::before{background-color:var(--hline);background-image:linear-gradient(90deg,transparent,var(--hink),transparent);background-size:45% 100%;background-repeat:no-repeat;animation:aSlideX 1.5s linear infinite}
  [data-anim="flow"] .v-prail .lane.in_progress::before{background-color:var(--hline);background-image:linear-gradient(180deg,transparent,var(--hink),transparent);background-size:100% 45%;background-repeat:no-repeat;animation:aSlideY 1.8s linear infinite}
  [data-anim="ripple"] .lnodes .cur .ln{box-shadow:none}
  [data-anim="ripple"] .lnodes .cur .ln::before,[data-anim="ripple"] .lnodes .cur .ln::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--hink);animation:aRipple 2s ease-out infinite}
  [data-anim="ripple"] .lnodes .cur .ln::after{animation-delay:1s}
}

<div class="mini" id="mini" aria-hidden="true"></div>

      <div class="pr"><button data-look="chase" aria-pressed="true">Chase</button><button data-look="graphite" aria-pressed="false">Graphite</button><button data-look="aurora" aria-pressed="false">Aurora</button><button data-look="evergreen" aria-pressed="false">Evergreen</button><button data-look="paper" aria-pressed="false">Paper</button></div>
      <p>Mode</p>
      <div class="pr"><button data-mode="auto" aria-pressed="true">Auto</button><button data-mode="light" aria-pressed="false">Light</button><button data-mode="dark" aria-pressed="false">Dark</button></div>
    </div>
  </details>
</div>
<div class="guide" id="guide" hidden></div>
<div class="shell" id="shell">
<header class="hero" id="hero"><div class="in" id="heroin"></div></header>
<div class="wrap">
  <div class="tabs" role="tablist" aria-label="View">
    <button role="tab" id="tab-run" aria-selected="true" aria-controls="view-run">Run</button>
    <button role="tab" id="tab-plan" aria-selected="false" aria-controls="view-plan">Plan</button>
  </div>

      <div id="run"></div>
      <div class="side">
        <div class="list sidecard" id="sidedet"></div>
        <div class="out">
          <div class="ohead"><span>Output</span><button class="linkbtn" id="outbtn">Show all</button></div>
          <div class="console" id="console"></div>
        </div>
      </div>
    </div>
  </main>
  <main class="view" id="view-plan" role="tabpanel" aria-labelledby="tab-plan" hidden>
    <div id="plan"></div>
  </main>
  <div class="foot">
    <button class="linkbtn" id="logbtn">Show the raw log this page is built from</button>
    <div id="logsec" hidden>
      <div class="path">log.jsonl, in the folder this page is in. The last 300 lines are shown.</div>
      <div class="log" id="log" tabindex="0" aria-label="Event log lines"></div>
    </div>
  </div>
</div>
</div>

  <div class="in">
    <button class="primary" id="play">Play</button>
    <button id="step" aria-label="Next event">Step</button>
    <input type="range" id="scrub" min="1" step="1" aria-label="Position in the recorded run">
    <span class="pos" id="pos"></span>
  </div>
</div>
<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
const clock = t => String(t || "").slice(11, 16);
const mins = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + "h " + m + "m" : m + "m"; };
const tf = s => s < 60 ? "under 1m" : mins(s);
const SK = (n, r) => "stage:" + n + (r ? "|" + r : ""), LK = (r, n) => "slice:" + r + ":" + n;
const IC = s => '<span class="ic ' + s + '"></span>';
const sec = (t, b) => b ? '<div class="dsec"><h3>' + t + "</h3>" + b + "</div>" : "";
const plural = (n, w) => n + " " + (n === 1 ? w : w === "criterion" ? "criteria" : w === "fix" ? "fixes" : w + "s");
const link = (url, text, cls) => /^https?:\/\//.test(url || "") ? '<a' + (cls ? ' class="' + cls + '"' : "") + ' href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(text) + "</a>" : (cls ? '<span class="' + cls + '">' + esc(text) + "</span>" : esc(text));
const SL = {intake:"Read the card and the code", interview:"Questions for you", plan:"Draft the plan", approval:"Your approval", build:"Build", self_check:"Self-check", closing:"Closing tests", review:"Full suite", pr:"Pull request"};
const DESC = {intake:"The agent reads the card and the code the change depends on.", interview:"Only the decisions the card and the code could not answer.", plan:"Slices with a named check each, tied to the acceptance criteria.", approval:"You read the plan and approve it in chat. No code is written before that.", self_check:"One pass over the whole diff for logging, error handling, missing values, config and the repo's coding instructions. Gaps are fixed on the spot.", closing:"Component tests that prove the criteria end to end.", review:"The whole test suite runs on the committed code.", pr:"The branch is pushed, a draft PR is opened, and CI is seen through to green.", you:"The PRs are yours to review. Each also needs an approval from someone else."};
const KIND = {insight:"Insight", issue_fix:"Issue and fix", command:"Command", correction:"Correction", went_well:"Went well", check_failed_again:"Check failed again"};

// ---------------------------------------------------------------- data
let EVENTS = [], LIVE = false, DEMO = null, pos = 0, timer = null, loadN = 0, sawData = false, misses = 0;
let sel = null, outOpen = false, logOpen = false, metaOpen = false, guideOpen = false, curTab = "run";
const toggled = {}, laneOpen = {}, planOpen = {criteria:true, slices:true, tplan:true, contract:true, assume:true, pq:true, pa:true, pd:true};
const isWide = () => window.matchMedia("(min-width: 1000px)").matches;

window.__runData = d => {
  if (!d || !Array.isArray(d.events)) return;
  sawData = true; misses = 0;
  if (DEMO) { DEMO = null; $("replay").hidden = true; }
  const changed = d.events.length !== EVENTS.length || !LIVE;
  LIVE = true; EVENTS = d.events;
  if (changed) render();
};
function poll() {
  const s = document.createElement("script");
  s.src = "run-data.js?n=" + (++loadN);
  s.onload = () => s.remove();
  s.onerror = () => { s.remove(); misses++; if (!sawData && misses === 2 && window.__demoData && !DEMO) startDemo(); };
  document.head.appendChild(s);
}
function startDemo() {
  DEMO = window.__demoData.events; EVENTS = DEMO; LIVE = false;
  pos = Math.min(DEMO.length, Math.max(1, Math.round(DEMO.length * 0.55)));
  $("replay").hidden = false; $("scrub").max = DEMO.length; render();
}

// ---------------------------------------------------------------- reduce the log into a state
function reduce(events, nowT) {
  const st = {stg:{}, now:"", questions:[], answered:[], approvalWait:null, waitSecs:0, waitSince:null, slices:{}, closing:{}, repos:[], notes:{}, con:[], plan:null, planRev:0,
    changes:[], commits:[], prlist:[], checks:{}, reqs:[], selfc:{}, finds:{}, prs:null, ended:false, last:0, lastT:"", ctx:SK("intake"), sliceRev:{}, pushed:{}, noticed:[]};
  if (!events.length) return st;
  const T0 = Date.parse(events[0].t) / 1000;
  const C = (e, text, cls, key) => st.con.push({t:e.t, text:text, cls:cls || "", key:key || st.ctx});
  const N = (key, item) => (st.notes[key] || (st.notes[key] = [])).push(item);
  const waitingNow = () => st.questions.length > 0 || !!st.approvalWait;
  const markWait = (s, before) => { const now = waitingNow(); if (now && !before) st.waitSince = s; if (!now && before && st.waitSince != null) { st.waitSecs += s - st.waitSince; st.waitSince = null; } };
  const unit = (repo, n) => n == null || n === "closing" ? st.closing[repo] : (st.slices[repo] || [])[n - 1];
  for (let i = 0; i < events.length; i++) {
    const e = events[i]; if (!e || !e.type) continue;
    const s = Math.max(0, (Date.parse(e.t) / 1000 - T0) || st.last); st.last = s; st.lastT = e.t;
    const wasWaiting = waitingNow();
    try {
      if (e.type === "run_start") { st.card = e.card; st.title = e.title; st.cardUrl = e.url; st.started = e.t; C(e, "Run started for " + e.card, "dim"); }
      else if (e.type === "stage") {
        const name = e.name === "suite" ? "review" : e.name, k = SK(name, e.repo), g = st.stg[k] || (st.stg[k] = {}), lab = (SL[name] || name) + (e.repo ? " in " + e.repo : "");
        if (e.state === "done") { if (g.start == null) g.start = s; g.state = "done"; g.end = s; if (e.ci) g.ci = e.ci; C(e, "✓ " + lab + " finished", "ok", k); }
        else {
          if (g.state !== "in_progress") { g.runs = (g.runs || 0) + 1; if (g.start == null || g.state === "done") g.start = s; }
          g.state = "in_progress"; g.end = null;
          if (name !== "build") st.ctx = k;
          if (e.reopened) { ["self_check", "review"].forEach(n2 => { const g2 = st.stg[SK(n2, e.repo)]; if (g2 && g2.state === "done") { g2.state = "todo"; g2.redo = true; } }); const gp = st.stg[SK("pr", e.repo)]; if (gp && gp.state === "done") gp.state = "in_progress"; C(e, "↺ " + e.repo + " is back in its build stage for a new slice", "warn", k); }
          else C(e, "▶ " + lab, "", k);
        }
      }
      else if (e.type === "now") { st.now = e.text; st.nowKey = st.ctx; }
      else if (e.type === "waiting") {
        if (e.on === "approval") { st.approvalWait = {since:s, text:e.text}; C(e, "⏸ Waiting on you: approve the plan in chat", "warn", SK("approval")); }
        else { st.questions.push({n:e.q || st.questions.length + 1, text:e.text, recommend:e.recommend, found:e.found, options:e.options, since:s, key:st.ctx, t:e.t}); C(e, "⏸ Waiting on you: " + e.text, "warn"); }
      }
      else if (e.type === "resumed") {
        if (st.questions.length && (e.closes || !st.approvalWait)) {
          const closes = e.closes || st.questions.map(q => q.n);
          st.questions.filter(q => closes.indexOf(q.n) >= 0).forEach(q => { st.answered.push(Object.assign({}, q, {answer:e.text, at:e.t})); N(q.key, {label:"You answered", text:q.text + " " + e.text}); });
          st.questions = st.questions.filter(q => closes.indexOf(q.n) < 0);
        } else if (st.approvalWait) { st.approvalWait = null; st.approved = {t:e.t, text:e.text}; }
        C(e, "▶ You replied: " + e.text, "");
      }
      else if (e.type === "plan") {
        const P = e.plan || e; st.plan = P; st.planRev = e.rev || st.planRev + 1; st.repos = (P.repos || []).map(r => r.repo);
        (P.repos || []).forEach(r => {
          const old = st.slices[r.repo] || [];
          st.slices[r.repo] = (r.slices || []).map((x, k) => { const o = old[k] || {}; const key = r.repo + ":" + (k + 1); if (!(key in st.sliceRev)) st.sliceRev[key] = st.planRev;
            return {n:k + 1, repo:r.repo, title:x.title, check:x.done_when, cmds:(x.checks || []).map(c => c.cmd), spec:x, state:o.state || "todo", start:o.start, end:o.end, commit:o.commit, url:o.url, nc:o.nc}; });
          const oc = st.closing[r.repo] || {};
          st.closing[r.repo] = r.closing ? {n:null, repo:r.repo, title:r.closing.title, check:r.closing.done_when, cmds:(r.closing.checks || []).map(c => c.cmd), spec:r.closing, commit:oc.commit, url:oc.url} : null;
        });
        (P.criteria || []).forEach(c => { c.proof = []; (P.repos || []).forEach(r => { (r.slices || []).forEach((x, k) => { if ((x.proves || []).indexOf(c.id) >= 0) c.proof.push([r.repo, k + 1]); }); if (r.closing && (r.closing.proves || []).indexOf(c.id) >= 0) c.proof.push([r.repo, "closing"]); }); });
        C(e, "▤ Plan version " + st.planRev + " saved", "dim", SK("plan"));
      }
      else if (e.type === "plan_change") { st.changes.push(e); if (e.change) { const q = st.reqs.find(x => x.id === e.change); if (q) { q.agreed = s; q.rev = e.rev; q.planText = e.text; } } C(e, "Δ Plan changed: " + e.text, "warn"); N(st.ctx, {label:"Plan changed", text:e.text}); }
      else if (e.type === "slice") { const x = unit(e.repo, e.n), k = LK(e.repo, e.n); if (x) { if (e.state === "in_progress") { if (x.start == null) x.start = s; st.ctx = k; C(e, "▶ Slice " + e.n + ": " + x.title, "", k); } if (e.state === "done") { x.end = s; C(e, "✓ Slice " + e.n + " verified and committed", "ok", k); } x.state = e.state; } }
      else if (e.type === "check") {
        const stage = e.stage === "suite" ? "review" : e.stage, k = e.slice ? LK(e.repo, e.slice) : SK(stage, e.repo);
        (st.checks[k] || (st.checks[k] = [])).push(e); C(e, "$ " + e.command, "dim", k);
        C(e, "  " + (e.timed_out ? "timed out after " + e.secs + " s" : e.passed + " passed, " + e.failed + " failed in " + e.secs + " s" + (e.ok === false && e.reason && !e.failed ? " (" + e.reason + ")" : "")), e.ok === false ? "bad" : "ok", k);
      }
      else if (e.type === "commit") {
        const k = e.slice ? LK(e.repo, e.slice) : st.ctx; e.key = k; st.commits.push(e);
        const x = e.slice ? unit(e.repo, e.slice) : e.kind === "closing" ? st.closing[e.repo] : null; if (x) { x.commit = e.hash; x.url = e.url; x.nc = (x.nc || 0) + 1; }
        { const q = st.reqs[st.reqs.length - 1]; if (q && q.agreed == null && q.done == null && (e.kind === "fix" || !q.tweaks)) q.tweaks = (q.tweaks || 0) + 1; }
        C(e, "⎇ " + e.hash + " " + e.subject + " (" + e.files + " files, +" + e.added + " −" + e.deleted + ")", "", k);
      }
      else if (e.type === "selfcheck") { st.selfc[SK("self_check", e.repo)] = e; }
      else if (e.type === "event") { C(e, "✕ " + e.text, "bad"); N(st.ctx, {label:KIND[e.kind] || cap(String(e.kind || "").replace(/_/g, " ")), text:e.text, cls:"f"}); }
      else if (e.type === "finding") { { const f = Object.assign({}, e); (st.finds[st.ctx] || (st.finds[st.ctx] = [])).push(f); st.noticed.push(f); } C(e, "! Noticed: " + e.text, "warn"); }
      else if (e.type === "learning") { C(e, "✎ " + (KIND[e.kind] || e.kind) + ": " + e.text, "dim"); N(st.ctx, {label:KIND[e.kind] || cap(e.kind), text:e.text, scope:e.scope}); }

function emptyState() {

function renderPlan(st, appr) {
  const P = st.plan, repos = st.repos, none = t => '<p class="lead" style="margin:0">' + t + "</p>";
  const Sg = k => (st.stg[SK(k)] || {}).state || "todo";
  const allQ = st.answered.concat(st.questions);
  if (!P) {
    $("plan").innerHTML = '<div class="draft"><b>The plan is still being worked out.</b> Each part below fills in as planning goes on. The full plan replaces this when the draft is ready.</div>' +
      '<p class="summary">' + (st.questions.length ? '<span style="color:var(--wait)">Waiting on you: ' + esc(st.questions[0].text) + "</span>" : esc(st.now || "Reading the card and the code")) + "</p>" +
      sect("pa", IC(Sg("intake")) + " The card", "", "<p style=\"margin:0\">" + link(st.cardUrl, st.card || "") + " " + esc(st.title || "") + "</p>") +

      sect("pd", IC(Sg("plan")) + " Drafting the plan", "", none(st.questions.length ? "Starts once the questions are settled." : "Working out the criteria, the slices and their checks."));

  const unitOf = (r, n) => n === "closing" ? st.closing[r] : (st.slices[r] || [])[n - 1];

  const stTxt = s => s === 2 ? "✅ Proven" : s === 1 ? "🔄 In progress" : "⬜ Not started";

  const all = [].concat.apply([], repos.map(r => (st.slices[r] || []).concat(st.closing[r] ? [st.closing[r]] : [])));
  const doneN = repos.reduce((a, r) => a + (st.slices[r] || []).filter(x => x.state === "done").length + (st.closing[r] && ustate(r, "closing") === "done" ? 1 : 0), 0);
  const status = appr ? "Approved by you at " + clock(st.approved ? st.approved.t : "") : "Waiting for your approval";
  const sum = '<div class="tablebox"><table class="kv"><tbody>' + [["What changes", esc(P.what)], ["Why", esc(P.why)], ["Not included", (P.not_included || []).length ? '<ul class="dec" style="padding-left:1.1em;margin:0">' + P.not_included.map(o => "<li>" + esc(o) + "</li>").join("") + "</ul>" : ""], ["Status", esc(status) + (st.planRev > 1 ? ", plan version " + st.planRev : "")], ["Risk", esc(cap(P.risk)) + (P.risk_reason ? ". " + esc(P.risk_reason) : "")], ["Work", esc(cap(P.work))], ["Scope", plural(all.length, "slice") + " in " + plural(repos.length, "repo")], ["Branch", '<span class="mono">' + esc(P.branch) + "</span>"]].filter(x => x[1]).map(x => "<tr><th>" + x[0] + "</th><td>" + x[1] + "</td></tr>").join("") + "</tbody></table></div>";
  const gaps = crits.filter(c => !(c.proof || []).length);
  const crit = '<div class="list">' + crits.map(c => '<div class="step"><div class="prow"><div style="flex:1"><b><span class="tag">' + esc(c.id) + "</span>" + esc(c.text) + '</b><span class="dw">' + stTxt(cstate(c)) + ". Test: " + esc((c.test || {}).layer) + ", " + esc((c.test || {}).scenario) + "</span>" +
    (c.proof || []).map(p => { const x = unitOf(p[0], p[1]) || {}; return '<div class="nest">' + IC(ustate(p[0], p[1])) + "<span>" + esc(p[0]) + ", " + (p[1] === "closing" ? "closing slice" : "slice " + p[1]) + ": " + esc(x.title) + "</span></div>"; }).join("") + "</div></div></div>").join("") + "</div>" +
    (gaps.length ? '<p class="lead" style="color:var(--fail)"><b>Coverage gap.</b> No slice proves ' + gaps.map(c => esc(c.id)).join(", ") + ".</p>" : "");
  const urow = (label, x, state) => '<div class="step"><div class="prow">' + IC(state) + "<div><b>" + label + esc(x.title) + '</b><span class="dw">Done when: ' + esc(x.check) + "</span>" + (x.spec.approach ? '<span class="dw"><b>Approach:</b> ' + esc(x.spec.approach) + "</span>" : "") + ((x.spec.tests_to_add || []).length ? '<span class="dw"><b>Tests to add:</b> ' + esc(x.spec.tests_to_add.join(", ")) + "</span>" : "") + (x.spec.depends_on ? '<span class="dw"><b>Depends on:</b> ' + esc(x.spec.depends_on) + "</span>" : "") + "</div></div></div>";
  const slicesH = (P.repos || []).map((rp, i) => '<div class="list"><div class="ghead"><span class="lbl">' + (i + 1) + ". " + esc(rp.repo) + '</span><span class="rt">from ' + esc(rp.base) + "</span></div>" +
    (st.slices[rp.repo] || []).map(x => urow("Slice " + x.n + ": ", x, x.state)).join("") +
    '<div class="step"><div class="prow">' + IC(Sg2(st, "self_check", rp.repo)) + '<div><b>Self-check</b><span class="dw">One pass over the diff. Gaps are fixed on the spot.</span></div></div></div>' +
    (st.closing[rp.repo] ? urow("Closing: ", st.closing[rp.repo], ustate(rp.repo, "closing")) : "") +

    '<div class="list"><div class="ghead"><span class="lbl">' + (repos.length + 1) + '. Finish</span></div><div class="step"><div class="prow">' + IC(st.prs ? "done" : st.prlist.length ? "in_progress" : "todo") + "<div><b>" + (repos.length > 1 ? "One linked draft PR per repo" : "One draft PR") + '</b><span class="dw">CI is seen through to green. Your review of the PRs is the second approval.</span></div></div></div></div>';
  const tests = P.tests_expected_to_change || [];
  const tplan = '<div class="tablebox"><table><thead><tr><th>Criterion</th><th>Layer</th><th>Scenario</th></tr></thead><tbody>' + crits.map(c => '<tr><td><span class="tag">' + esc(c.id) + "</span></td><td>" + esc(cap((c.test || {}).layer)) + "</td><td>" + esc((c.test || {}).scenario) + "</td></tr>").join("") + '</tbody></table></div><div class="dsec"><h3>Existing tests expected to change</h3>' +
    (tests.length ? tests.map(t => '<div class="nt"><b class="mono">' + esc(t.test) + "</b><br><span>" + esc(t.change) + "</span></div>").join("") : '<div class="nt"><span>None.</span></div>') + '<p class="lead" style="margin:4px 0 0">A failing test that is not on this list is treated as a regression, not edited to pass.</p></div>';
  const con = P.contract;
  const conH = con ? (typeof con === "string" ? "<p>" + esc(con) + "</p>" : (con.summary ? '<p class="lead" style="margin:0 0 8px">' + esc(con.summary) + "</p>" : "") + ((con.items || []).length ? '<div class="tablebox"><table><thead><tr><th>Name</th><th>Kind</th><th>Change</th></tr></thead><tbody>' + con.items.map(f => "<tr><td><code>" + esc(f.name) + "</code></td><td>" + esc(f.kind) + "</td><td>" + esc(f.change) + "</td></tr>").join("") + "</tbody></table></div>" : "")) : "";
  const chg = st.changes.map(c => { const q = c.change ? st.reqs.find(x => x.id === c.change) : null; return '<div class="nt"><b>' + (q ? "Change " + q.id + ": " + esc(q.text) : esc(c.text)) + "</b><br>" + (q ? "<span>" + esc(c.text) + "</span><br>" : "") + "<span>" + esc(cap(c.approval || "")) + ", " + clock(c.t) + "</span></div>"; })
    .concat(st.reqs.filter(q => q.agreed == null).map(q => '<div class="nt"><b>Change ' + q.id + ": " + esc(q.text) + "</b><br><span>" + (q.withdrawn ? "Withdrawn." : q.tweaks ? "Handled inside the approved plan." : "Being sized.") + " Asked at " + clock(q.t) + "</span></div>"));
  $("plan").innerHTML = (appr ? "" : '<div class="draft"><b>Draft plan.</b> Read it here, then approve or ask for changes in chat. This page picks up your approval and carries on.</div>') + '<div class="pgrid"><div>' + sum +
    sect("criteria", "Acceptance criteria", proven + " of " + crits.length + " proven", crit) +
    (allQ.length ? sect("pq", "Questions you answered", allQ.length, allQ.map(qaHtml).join("")) : "") +
    "</div><div>" +
    sect("slices", "Slices, in order", doneN + " of " + all.length + " verified", slicesH) +
    sect("tplan", "Test plan", plural(crits.length, "scenario"), tplan) +
    (conH ? sect("contract", "Contract", plural((con.items || []).length, "item"), conH) : "") +
    ((P.decisions || []).length ? sect("decisions", "Decisions", P.decisions.length, '<ol class="dec">' + P.decisions.map(d => "<li>" + esc(d.text || d) + "</li>").join("") + "</ol>") : "") +
    ((P.assumptions || []).length ? sect("assume", "Assumptions", P.assumptions.length, '<p class="lead" style="margin:0 0 6px">Things the agent took as given. Say so in chat if one is wrong.</p><ol class="dec">' + P.assumptions.map(d => "<li>" + esc(d) + "</li>").join("") + "</ol>") : "") +

function Sg2(st, name, repo) { return (st.stg[SK(name, repo)] || {}).state || "todo"; }

function setLook(v) { document.documentElement.setAttribute("data-look", v); document.querySelectorAll("[data-look]").forEach(b => { if (b.tagName === "BUTTON") b.setAttribute("aria-pressed", String(b.getAttribute("data-look") === v)); }); try { localStorage.setItem("monitor-look", v); } catch (e) {} }
